<!DOCTYPE html>
<html>
<head>
  <title>Bed Board - CareGrid</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth-guard.js"></script>
</head>
<body>
  <nav id="mainNav"></nav>

  <h2>Live Bed Availability Board</h2>
  <p id="hospitalLabel" style="color:#666;"></p>

  <div class="card" id="addBedCard">
    <h3>Add a Bed to Your Hospital</h3>
    <form id="addBedForm">
      <input name="bedNumber" placeholder="Bed Number (e.g. A1)" required>
      <input name="ward" placeholder="Ward (e.g. General)">
      <button type="submit">Add Bed</button>
    </form>
  </div>

  <div class="bed-grid" id="bedBoard"></div>

  <script src="api.js"></script>
  <script>
    const role = localStorage.getItem("role");
    const myHospital = localStorage.getItem("hospitalName");
    const isHospitalAdmin = role === "hospital_admin";
    const isNetworkAdmin = role === "network_admin";

    if (isHospitalAdmin) {
      document.getElementById("hospitalLabel").textContent = `Showing beds for: ${myHospital}`;
    } else {
      document.getElementById("hospitalLabel").textContent = "Viewing all hospitals (read-only)";
      document.getElementById("addBedCard").style.display = "none";
    }

    async function loadBeds() {
      const res = await fetch(`${API_BASE}/beds`);
      let beds = await res.json();

      // Hospital Admin only sees/manages their own hospital's beds
      if (isHospitalAdmin) {
        beds = beds.filter((b) => b.hospitalName === myHospital);
      }

      const board = document.getElementById("bedBoard");
      board.innerHTML = "";

      if (beds.length === 0) {
        board.innerHTML = "<p>No beds yet.</p>";
        return;
      }

      beds.forEach((bed) => {
        const div = document.createElement("div");
        div.className = `bed ${bed.status}`;
        div.innerHTML = `
          <div>${bed.hospitalName}</div>
          <div>Bed ${bed.bedNumber}</div>
          <div>${bed.ward || ""}</div>
          <div>${bed.status.toUpperCase()}</div>
        `;

        // Only Hospital Admin can click to change status — Network Admin is view-only
        if (isHospitalAdmin) {
          div.style.cursor = "pointer";
          div.title = "Click to cycle status";
          div.addEventListener("click", () => cycleStatus(bed));
        }

        board.appendChild(div);
      });
    }

    async function cycleStatus(bed) {
      const nextStatus = { free: "occupied", occupied: "cleaning", cleaning: "free" };
      const newStatus = nextStatus[bed.status];

      const res = await fetch(`${API_BASE}/beds/${bed._id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: newStatus }),
      });

      if (!res.ok) {
        const err = await res.json();
        alert(err.error || "Could not update bed");
      }
      loadBeds();
    }

    document.getElementById("addBedForm")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      data.hospitalName = myHospital; // always locked to their own hospital
      await fetch(`${API_BASE}/beds`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      e.target.reset();
      loadBeds();
    });

    loadBeds();
    setInterval(loadBeds, 5000);
  </script>

  <script src="nav.js"></script>
</body>
</html>
