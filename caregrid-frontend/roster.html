<!DOCTYPE html>
<html>

<head>
  <title>Shift Roster - CareGrid</title>
  <link rel="stylesheet" href="style.css">
  <script src="auth-guard.js"></script>
</head>

<body>
  <nav id="mainNav"></nav>

  <h2>Doctor & Nurse Shift Roster</h2>

  <div class="card" id="rosterFormCard">
    <h3>Add a Shift</h3>
    <form id="shiftForm">
      <select id="hospitalSelect" required>
        <option value="">Select Hospital</option>
      </select>
      <select id="roleSelect" required>
        <option value="">Select Role</option>
        <option value="doctor">Doctor</option>
        <option value="nurse">Nurse</option>
      </select>
      <select id="staffSelect" required>
        <option value="">Select Staff</option>
      </select>
      <input id="departmentInput" name="department" placeholder="Department (e.g. ICU)">
      <input name="shiftDate" type="date" required>
      <select name="shiftType">
        <option value="12hr">12 hours</option>
        <option value="24hr">24 hours</option>
      </select>
      <input name="startTime" type="time" required>
      <input name="endTime" type="time" required>
      <button type="submit">Add Shift</button>
    </form>
    <p id="shiftResult"></p>
  </div>

  <h3 id="rosterHeading">Upcoming Roster</h3>
  <table>
    <thead>
      <tr>
        <th>Staff</th>
        <th>Role</th>
        <th>Hospital</th>
        <th>Department</th>
        <th>Date</th>
        <th>Time</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="rosterList"></tbody>
  </table>

  <script src="api.js"></script>
  <script>
    const rosterRole = localStorage.getItem("role");
    const currentUserName = localStorage.getItem("name");
    const isNetworkAdmin = rosterRole === "network_admin";

    const card = document.getElementById("rosterFormCard");
    card.style.display = (rosterRole === "network_admin") ? "block" : "none";

    const rosterHeading = document.getElementById("rosterHeading");
    if (rosterHeading && !isNetworkAdmin) {
      rosterHeading.textContent = "Your Upcoming Roster";
    }

    async function loadHospitalOptions() {
      const hospitalSelect = document.getElementById("hospitalSelect");
      if (!hospitalSelect) return;

      try {
        const res = await fetch(`${API_BASE}/hospitals`);
        const hospitals = await res.json();
        hospitalSelect.innerHTML = '<option value="">Select Hospital</option>' + hospitals
          .map((h) => `<option value="${h.name}">${h.name}</option>`)
          .join("");
      } catch (err) {
        console.error("Database hospital fetch failed:", err);
        hospitalSelect.innerHTML = '<option value="">Select Hospital</option>';
      }
    }

    async function loadStaffOptions() {
      const hospitalSelect = document.getElementById("hospitalSelect");
      const roleSelect = document.getElementById("roleSelect");
      const staffSelect = document.getElementById("staffSelect");
      if (!hospitalSelect || !roleSelect || !staffSelect) return;

      const hospitalName = hospitalSelect.value;
      const role = roleSelect.value;
      if (!hospitalName || !role) {
        staffSelect.innerHTML = '<option value="">Select Staff</option>';
        return;
      }

      const res = await fetch(`${API_BASE}/auth/users?role=${encodeURIComponent(role)}&hospitalName=${encodeURIComponent(hospitalName)}`);
      const users = await res.json();
      staffSelect.innerHTML = '<option value="">Select Staff</option>' + users
        .map((u) => `<option value="${u.name}">${u.name}</option>`)
        .join("");
    }

    document.getElementById("hospitalSelect")?.addEventListener("change", loadStaffOptions);
    document.getElementById("roleSelect")?.addEventListener("change", loadStaffOptions);

    async function loadRoster() {
      const tbody = document.getElementById("rosterList");
      if (!tbody) return;

      let url = `${API_BASE}/shifts`;
      if (!isNetworkAdmin && currentUserName) {
        url += `?staffName=${encodeURIComponent(currentUserName)}`;
      }

      const res = await fetch(url);
      const shifts = await res.json();
      tbody.innerHTML = "";

      if (!Array.isArray(shifts) || shifts.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7">No upcoming shifts found.</td></tr>`;
        return;
      }

      shifts.forEach((s) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${s.staffName}</td>
          <td>${s.role}</td>
          <td>${s.hospitalName || "-"}</td>
          <td>${s.department || "-"}</td>
          <td>${s.shiftDate}</td>
          <td>${s.startTime} - ${s.endTime}</td>
          <td>${isNetworkAdmin ? `<button onclick="removeShift('${s._id}')">Remove</button>` : "-"}</td>
        `;
        tbody.appendChild(row);
      });
    }

    async function removeShift(id) {
      await fetch(`${API_BASE}/shifts/${id}`, { method: "DELETE" });
      loadRoster();
    }

    document.getElementById("shiftForm")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const hospitalName = document.getElementById("hospitalSelect").value;
      const role = document.getElementById("roleSelect").value;
      const staffName = document.getElementById("staffSelect").value;
      const department = document.getElementById("departmentInput").value;
      const shiftDate = e.target.shiftDate.value;
      const startTime = e.target.startTime.value;
      const endTime = e.target.endTime.value;
      const shiftType = e.target.shiftType.value;

      const resultBox = document.getElementById("shiftResult");

      const res = await fetch(`${API_BASE}/shifts`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          staffName,
          role,
          hospitalName,
          department,
          shiftDate,
          startTime,
          endTime,
          shiftType,
        }),
      });
      const json = await res.json();

      if (json.error) {
        resultBox.textContent = json.error;
      } else {
        resultBox.textContent = "Shift added";
        e.target.reset();
        document.getElementById("staffSelect").innerHTML = '<option value="">Select Staff</option>';
        loadRoster();
      }
    });

    loadHospitalOptions();
    loadRoster();
  </script>

  <script src="nav.js"></script>
</body>

</html>
